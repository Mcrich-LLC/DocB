# The Xcode project for the app, generated with `xcodegen generate`. Everything real lives in
# the Swift package at this folder; the app target is the bundle around it. Identity (team,
# bundle id) comes from Local.xcconfig, which is not committed.
name: DocB
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
    visionOS: "2.0"
  createIntermediateGroups: true
  generateEmptySchemes: false
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  DocB:
    path: .
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: 1.26.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DocB:
    type: application
    supportedDestinations: [macOS, iOS, visionOS]
    sources:
      - App/Main
    dependencies:
      - package: DocB
        product: DocBStore
      - package: DocB
        product: DocBSources
      - package: DocB
        product: DocCSchema
      - package: DocB
        product: DocBPage
      - package: DocB
        product: DocBRender
      - package: ComposableArchitecture
        product: ComposableArchitecture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: DocB
        CODE_SIGN_ENTITLEMENTS: App/Main/DocB.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: DocB
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  DocBTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS, visionOS]
    sources:
      - App/Tests
    dependencies:
      - target: DocB   # the host app links every package product the tests use
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)Tests
        # XcodeGen derives an iOS-style host path for multi-destination targets; macOS bundles differ.
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/DocB.app/Contents/MacOS/DocB
schemes:
  DocB:
    build:
      targets:
        DocB: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DocBTests
    archive:
      config: Release
