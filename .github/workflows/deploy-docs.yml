name: Deploy Docs to Cloudflare Workers

on:
  push:
    branches: [] # Update this to your default branch if different

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  DocBCore:
    runs-on: macos-26
    
    environment:
      name: production
      url: https://docb.app/documentation
    permissions:
      contents: read
      deployments: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build DocC
        run: |
          swift package \
          --allow-writing-to-directory ./Packages/DocBCore/docs \
          generate-documentation --target DocBCore \
          --disable-indexing \
          --transform-for-static-hosting \
          --hosting-base-path documentation/docbcore \
          --experimental-skip-synthesized-symbols \
          --output-path ./Packages/DocBCore/docs

      - name: Deploy to Cloudflare Workers
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy worker.js
          workingDirectory: './Packages/DocBCore' 
  DocCKit:
    runs-on: macos-26
    
    environment:
      name: production
      url: https://docb.app/documentation
    permissions:
      contents: read
      deployments: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build DocC
        run: |
          swift package \
          --allow-writing-to-directory ./Packages/DocCKit/docs \
          generate-documentation --target DocCKit \
          --disable-indexing \
          --transform-for-static-hosting \
          --hosting-base-path documentation/docckit \
          --experimental-skip-synthesized-symbols \
          --output-path ./Packages/DocCKit/docs

      - name: Deploy to Cloudflare Workers
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy worker.js
          workingDirectory: './Packages/DocCKit' 
