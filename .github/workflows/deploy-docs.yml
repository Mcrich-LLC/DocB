name: Deploy DocC to Cloudflare Workers

on:
  push:
    branches: ["main"] # Update this to your default branch if different

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: macos-26
    
    environment:
      name: production
      url: https://DocB.mcrich23.workers.dev
    permissions:
      contents: read
      deployments: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build DocC
        run: |
          # Disable Xcode macro fingerprint validation to prevent spurious build errors
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

          xcodebuild docbuild \
            -project DocB.xcodeproj \
            -scheme DocB \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
            
          # Find the generated archive and transform it for static hosting
          ARCHIVE_PATH=$(find .build -type d -name '*.doccarchive' | head -n 1)
          
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "Error: Could not find .doccarchive file"
            exit 1
          fi
          
          echo "Found archive at: $ARCHIVE_PATH"
          
          $(xcrun --find docc) process-archive transform-for-static-hosting \
            "$ARCHIVE_PATH" \
            --output-path ./docs \
            --hosting-base-path / # Update this string if you want to host on a subpath like /docs

      - name: Deploy to Cloudflare Workers
        id: cloudflare_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy worker.js
